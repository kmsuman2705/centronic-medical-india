# Optional reverse proxy so the Node service (port 3000) is reachable on plain HTTP port 80.
# Copy to /etc/nginx/sites-available/centronic and symlink into sites-enabled.
server {
    listen 80;
    server_name _;

    # Must be larger than the 40 MB catalogue PDF upload limit.
    client_max_body_size 45M;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
