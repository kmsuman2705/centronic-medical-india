services:
  centronic:
    build: .
    image: centronic-medical-india:latest
    container_name: centronic-medical-india
    restart: unless-stopped

    # Compose reads the local .env file automatically. All values have defaults,
    # so `docker compose up -d --build` works even before .env is created.
    # Set ADMIN_PASSWORD / ADMIN_SESSION_SECRET in .env before going live.
    environment:
      NODE_ENV: production
      PORT: "3000"
      # The site is served over HTTPS by Caddy, so lock admin cookies to HTTPS.
      COOKIE_SECURE: "true"
      APP_URL: ${APP_URL:-https://www.centronicmedical.com}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-centronic2026}
      ADMIN_SESSION_SECRET: ${ADMIN_SESSION_SECRET:-centronic-admin-fallback-secret-change-me}

    # Only Caddy publishes ports. The Node app is reachable inside the compose network.
    expose:
      - "3000"

    volumes:
      # Persist uploaded images/PDFs and the catalog JSON across container rebuilds.
      - cmi-data:/app/data
      - cmi-uploads:/app/uploads

    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  caddy:
    image: caddy:2-alpine
    container_name: centronic-caddy
    restart: unless-stopped
    depends_on:
      centronic:
        condition: service_healthy

    environment:
      SITE_EMAIL: ${SITE_EMAIL:-admin@centronicmedical.com}

    ports:
      # Port 80 is required for Let's Encrypt HTTP-01 validation and HTTP -> HTTPS redirect.
      - "80:80"
      - "443:443"
      - "443:443/udp"

    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Let's Encrypt certificates and Caddy autosaved config survive rebuilds.
      - caddy-data:/data
      - caddy-config:/config

    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:2019/config/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  cmi-data:
  cmi-uploads:
  caddy-data:
  caddy-config:
