services:
  centronic:
    build: .
    image: centronic-medical-india:latest
    container_name: centronic-medical-india
    restart: unless-stopped

    # Create .env from .env.example first and set ADMIN_PASSWORD / ADMIN_SESSION_SECRET.
    env_file:
      - .env

    environment:
      NODE_ENV: production
      PORT: 3000
      # Set to true only when the site is behind HTTPS.
      COOKIE_SECURE: "false"

    ports:
      # Public HTTP on the EC2 instance's public IP, plus direct port 3000 access.
      - "80:3000"
      - "3000:3000"

    volumes:
      # Persist uploaded images/PDFs and the catalog JSON across container rebuilds.
      - cmi-data:/app/data
      - cmi-uploads:/app/uploads

    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  cmi-data:
  cmi-uploads:
